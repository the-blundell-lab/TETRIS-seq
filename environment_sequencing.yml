# Conda environment for the sequencing pipeline (the Watson_code_*.py scripts
# invoked by scripts/Watson_code_SNV_panel_v1.7.sh and Watson_code_CNV_panel_v2.3.sh).
#
#   conda env create -f environment_sequencing.yml
#   conda activate tetris-seq-pipeline
#
# Python 3.7.4 was used for the sequencing pipeline; conda-forge no longer ships
# that exact patch release, so the pin is python=3.7 (3.7.9 at the time of
# writing). The exact 3.7-era versions of the Python libraries below were not
# separately recorded; those pins are left loose so conda can resolve a
# compatible set. The tool versions, which are what affect results, are pinned. The command-line
# tools (BWA, samtools, etc.) are pinned to the versions used in the manuscript.
#
# NOTE: GATK 3.8, ANNOVAR (June 2020), the dbSNP interval files and the reference
# genome are installed separately - see docs/INSTALL.md.
#
name: tetris-seq-pipeline
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.7              # 3.7.4 was used; that exact patch is no longer in conda-forge
  - bwa=0.7.17
  - samtools=1.11          # samtools 1.10 and 1.11 were both used
  - htslib                 # provides tabix
  - openjdk=8              # Picard 2.18, GATK 3.8 and fgbio 1.3 all need Java 8
  - picard=2.18.15
  - fgbio=1.3.0
  - vardict-java=1.8.2     # called as `vardict-java` from PATH
  - pindel=0.2.5b9         # FLT3-ITD calling (the only release since 2017)
  - pysam
  - pyfaidx
  - numpy
  - biopython
  - pandas
  - scipy
  # GATK 3.8 and ANNOVAR are installed manually (see docs/INSTALL.md) and
  # pointed to via config/config.sh.
